apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: app
  labels: { app: api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          # Built with: scripts/build-image.sh (replace OWNER with your registry namespace)
          image: ghcr.io/OWNER/beyond-the-code-api:1.0.0
          ports:
            - { name: http, containerPort: 8080 }
          env:
            # The models are reached through KServe's cluster-internal predictor services.
            - name: Inference__Chat
              value: http://qwen-predictor.models.svc.cluster.local/openai/v1
            - name: Inference__Embeddings
              value: http://embed-predictor.models.svc.cluster.local/openai/v1
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://aspire-dashboard.observability.svc.cluster.local:18889
            - name: OTEL_SERVICE_NAME
              value: beyond-the-code-api
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1654   # the "app" user of the .NET base images
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
