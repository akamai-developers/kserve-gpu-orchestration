# The models are not authenticated, so only the app namespace may reach them.
# (kubectl port-forward still works: it doesn't go through pod networking rules.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-only
  namespace: models
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: app
