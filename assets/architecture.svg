<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="580" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest">
<title id="title">Beyond the Code: architecture</title>
<desc id="desc">Users reach a NodeBalancer and the Gateway API Gateway run by NGINX Gateway Fabric, which routes to the .NET app on LKE. The app calls an LLM (Qwen3-4B on vLLM, GPU pool) and an embedding model (multilingual-e5, CPU pool) that stay cluster-internal, and sends traces to an Aspire dashboard. Terraform or Pulumi provision the cluster and platform: Gateway API CRDs, NGINX Gateway Fabric, cert-manager, KServe and the NVIDIA GPU Operator.</desc>
<style>
  .t { font: 600 16px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .s { font: 400 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .l { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 1px; }
  .edge { fill: none; stroke: #002F6C; stroke-width: 2; }
  .pulse { animation: pulse 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 0%, 30%, 70%, 100% { opacity: 0; } 40%, 60% { opacity: .9; } }
  @media (prefers-reduced-motion: reduce) { .pkt { display: none; } .pulse { animation: none; } }
</style>
